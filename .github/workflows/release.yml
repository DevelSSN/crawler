name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  jvm-fastjar:
    name: JVM fast-jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spider

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NAME="crawler-${TAG}-jvm-fastjar"
          mkdir -p "dist/${NAME}/docs"
          cp -r doctech/target/quarkus-app/. "dist/${NAME}/"
          cp spider/target/release/crawler "dist/${NAME}/"
          cp scripts/run-jvm.sh "dist/${NAME}/run.sh"
          chmod +x "dist/${NAME}/run.sh" "dist/${NAME}/crawler"
          cd dist
          zip -r "${NAME}.zip" "${NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: jvm-fastjar
          path: dist/*.zip

  jvm-uber:
    name: JVM uber-jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spider

      - name: Build
        run: mvn -B clean package -DskipTests -Dquarkus.package.jar.type=uber-jar

      - name: Bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NAME="crawler-${TAG}-jvm-uber"
          JAR=$(find doctech/target -maxdepth 1 -name '*-runner.jar' -type f | head -n1)
          test -n "$JAR"
          mkdir -p "dist/${NAME}/docs"
          cp "$JAR" "dist/${NAME}/quarkus-run.jar"
          cp spider/target/release/crawler "dist/${NAME}/"
          cp scripts/run-jvm.sh "dist/${NAME}/run.sh"
          chmod +x "dist/${NAME}/run.sh" "dist/${NAME}/crawler"
          cd dist
          zip -r "${NAME}.zip" "${NAME}"
          cp "../${JAR#../}" "crawler-${TAG}-uber.jar"
          cp ../spider/target/release/crawler "crawler-${TAG}-linux-x86_64"
          chmod +x "crawler-${TAG}-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: jvm-uber
          path: |
            dist/*.zip
            dist/*.jar
            dist/crawler-*-linux-x86_64

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - jvm-fastjar
      - jvm-uber
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cp install-build.sh dist/
          cd dist
          sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

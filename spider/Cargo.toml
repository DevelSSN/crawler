[package]
name = "crawler"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = {version = "4.6.7", features = ["derive"]}
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["gzip", "brotli", "deflate", "stream"] }
scraper = "0.29.0"
url = "2.5.8"
anyhow = "1.0.104"
robotstxt = "0.3.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
regex = "1.13.1"
ipnet = "2.12.2"
futures-util = "0.3.34"
